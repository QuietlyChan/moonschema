name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MoonBit
        uses: moonbitlang/setup-moonbit@v1
      - name: Check
        run: moon check
      - name: Format
        run: |
          moon fmt
          git diff --exit-code
      - name: Test (native)
        run: moon test
      - name: Test (wasm-gc)
        run: moon test --target wasm-gc
