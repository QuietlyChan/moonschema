<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>moonschema playground — JSON Schema 校验（MoonBit → JS）</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #ffffff;
    --fg: #171717;
    --muted: #6b6b6b;
    --border: #eaeaea;
    --hover: #fafafa;
  }
  html, body { background: var(--bg); }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
      "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px;
      text-decoration-color: #c9c9c9; }
  a:hover { text-decoration-color: var(--fg); }

  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; flex-wrap: wrap;
  }
  header h1 {
    margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
  }
  header h1 .dot { display: inline-block; width: 8px; height: 8px;
    background: var(--fg); border-radius: 2px; margin-right: 8px;
    vertical-align: 1px; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  header code {
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    background: var(--hover); border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 4px;
  }
  .gh-link { font-size: 13px; color: var(--muted); white-space: nowrap;
    padding-top: 2px; }

  main { max-width: 1180px; margin: 0 auto; padding: 20px 24px 48px; }

  .toolbar {
    display: flex; gap: 10px; align-items: center;
    margin: 0 0 14px; flex-wrap: wrap;
  }
  .toolbar label { font-size: 13px; color: var(--muted); }
  select {
    font-size: 13px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  }
  select:focus { outline: none; border-color: var(--fg); }
  button {
    background: var(--fg); color: #fff;
    border: 1px solid var(--fg); border-radius: 6px;
    padding: 6px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  button:hover { background: #383838; }
  .meta { font-size: 12px; color: var(--muted); margin-left: auto;
    font-family: ui-monospace, Consolas, monospace; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .panel h2 {
    margin: 0 0 10px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  }
  textarea {
    width: 100%; height: 300px; resize: vertical;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12.5px; line-height: 1.55;
    border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
    background: var(--bg); color: var(--fg);
  }
  textarea:focus { outline: none; border-color: var(--fg); }

  .spacer { height: 16px; }
  #banner {
    padding: 11px 14px; border-radius: 6px; font-size: 13.5px;
    font-weight: 500; margin-bottom: 14px; display: none;
    border: 1px solid var(--border);
  }
  #banner.ok {
    background: #f0fdf4; color: #15803d; border-color: #bbf7d0;
  }
  #banner.fail {
    background: #fef2f2; color: #dc2626; border-color: #fecaca;
  }
  #banner.warn {
    background: var(--hover); color: var(--fg); font-weight: 400;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px;
    border-bottom: 1px solid var(--border); vertical-align: top; }
  th {
    background: var(--hover); color: var(--muted); font-weight: 500;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  }
  tr:last-child td { border-bottom: 0; }
  td.path, td.kw {
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
  }
  td.path { color: var(--muted); }
  td.kw { color: var(--fg); }

  footer {
    border-top: 1px solid var(--border);
    text-align: center; font-size: 12.5px; color: var(--muted);
    padding: 18px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1><span class="dot"></span>moonschema playground</h1>
    <p>纯 MoonBit 实现的 JSON Schema 2020-12 校验引擎，编译为 JS 在浏览器运行 ·
       支持 <code>x-rules</code> 跨字段规则 · 中英双语错误</p>
  </div>
  <div class="gh-link"><a href="https://github.com/QuietlyChan/moonschema">GitHub ↗</a></div>
</header>
<main>
  <div class="toolbar">
    <label>示例</label>
    <select id="preset">
      <option value="user">用户资料（基础关键词）</option>
      <option value="order">订单（x-rules 跨字段规则）</option>
      <option value="tree">递归树（$ref 递归）</option>
    </select>
    <button id="btn">校验</button>
    <span class="meta" id="ver"></span>
  </div>
  <div class="grid">
    <div class="panel">
      <h2>JSON Schema</h2>
      <textarea id="schema" spellcheck="false"></textarea>
    </div>
    <div class="panel">
      <h2>实例 JSON</h2>
      <textarea id="data" spellcheck="false"></textarea>
    </div>
  </div>
  <div class="spacer"></div>
  <div id="banner"></div>
  <div id="errors"></div>
</main>
<footer>
  moonschema · <a href="https://github.com/QuietlyChan/moonschema">GitHub</a> ·
  Apache-2.0
</footer>
<script type="module">
import { validate_json, version } from './moonschema.js'

const $ = id => document.getElementById(id)
const presets = {
  user: {
    schema: {
      type: 'object',
      required: ['name', 'email'],
      properties: {
        name: { type: 'string', minLength: 2, maxLength: 50 },
        email: { type: 'string' },
        age: { type: 'integer', minimum: 0, maximum: 150 },
        role: { enum: ['admin', 'user'] },
        tags: { type: 'array', items: { type: 'string' }, uniqueItems: true, maxItems: 5 }
      },
      additionalProperties: false
    },
    data: { name: 'A', email: 42, age: -1, role: 'guest', tags: ['a', 'a'], extra: true }
  },
  order: {
    schema: {
      type: 'object',
      required: ['start', 'end', 'total', 'items'],
      properties: {
        start: { type: 'string' },
        end: { type: 'string' },
        total: { type: 'number' },
        items: {
          type: 'array',
          items: { type: 'object', properties: { price: { type: 'number' }, qty: { type: 'number' } } }
        }
      },
      additionalProperties: false,
      'x-rules': ['end > start', 'items[0].price * items[0].qty == total']
    },
    data: { start: '2026-05-01', end: '2026-01-01', total: 99, items: [{ price: 10, qty: 2 }] }
  },
  tree: {
    schema: {
      type: 'object',
      required: ['value'],
      properties: {
        value: { type: 'integer' },
        children: { type: 'array', items: { $ref: '#' } }
      }
    },
    data: { value: 1, children: [{ value: 2, children: [{ value: 'oops' }] }, { value: 3 }] }
  }
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}

function render(out) {
  const banner = $('banner'), box = $('errors')
  let result
  try { result = JSON.parse(out) } catch { banner.className = 'warn'; banner.style.display = 'block'
    banner.textContent = '引擎返回无法解析：' + out; box.innerHTML = ''; return }
  if (result.schema_error) {
    banner.className = 'fail'; banner.style.display = 'block'
    banner.textContent = 'Schema 不合法：' + result.schema_error
    box.innerHTML = ''; return
  }
  if (result.data_parse_error) {
    banner.className = 'fail'; banner.style.display = 'block'
    banner.textContent = '实例 JSON 解析失败：' + result.data_parse_error
    box.innerHTML = ''; return
  }
  if (result.valid) {
    banner.className = 'ok'; banner.style.display = 'block'
    banner.textContent = '✓ 校验通过'
    box.innerHTML = ''; return
  }
  banner.className = 'fail'; banner.style.display = 'block'
  banner.textContent = `✗ 校验失败：${result.errors.length} 个错误`
  const rows = result.errors.map(e => `
    <tr>
      <td class="path">${esc(e.instance_path || '(root)')}</td>
      <td class="kw">${esc(e.keyword)}</td>
      <td>${esc(e.message)}</td>
      <td class="path">${esc(e.schema_path)}</td>
    </tr>`).join('')
  box.innerHTML = `
    <table>
      <tr><th>实例位置</th><th>关键词</th><th>消息</th><th>Schema 位置</th></tr>
      ${rows}
    </table>`
}

function run() { render(validate_json($('schema').value, $('data').value)) }

$('preset').addEventListener('change', () => {
  const p = presets[$('preset').value]
  $('schema').value = JSON.stringify(p.schema, null, 2)
  $('data').value = JSON.stringify(p.data, null, 2)
  run()
})
$('btn').addEventListener('click', run)
let deb
for (const id of ['schema', 'data']) {
  $(id).addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(run, 400) })
}

$('ver').textContent = 'v' + version()
$('preset').dispatchEvent(new Event('change'))
</script>
</body>
</html>
